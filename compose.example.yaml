# Housetrained: example Docker Compose setup. Copy to compose.yaml and adjust.
# Data (database, photos, secret key) lives in ./config; back that folder up.
name: housetrained
services:
  housetrained:
    container_name: housetrained
    image: ghcr.io/viciousnemesis/housetrained:1     # or build it yourself: replace this line with "build: ."
    environment:
      - PUID=1000                   # user and group that own ./config
      - PGID=1000
      - TZ=Etc/UTC                  # your time zone, e.g. Europe/London
      - ALLOWED_HOSTS=localhost     # required: every hostname you open it at, comma-separated, e.g. pets.example.com
      - CSRF_TRUSTED_ORIGINS=http://localhost:8000   # every address you open it at, e.g. https://pets.example.com
      # - SECURE_PROXY_SSL_HEADER=True   # behind a reverse proxy that handles HTTPS (cookies become HTTPS-only)
      # - ADMIN_PASSWORD=change-me       # first admin password; otherwise a random one is printed in the log
      # - PUSH_CONTACT=mailto:you@example.com   # sent with reminder notifications
    volumes:
      - ./config:/config
    ports:
      - 8000:8000
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
