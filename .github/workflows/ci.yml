# Housetrained CI (PUP-121): the test suite and a missing-migration check on every push and pull request.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      DJANGO_SETTINGS_MODULE: housetrained.settings.test
      SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: No missing migrations
        run: python manage.py makemigrations pets --check --dry-run
      - name: Tests
        run: python manage.py test --parallel 1
