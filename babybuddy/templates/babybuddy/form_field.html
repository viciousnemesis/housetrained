{% load widget_tweaks pets_tags %}
<div class="row mb-3">
    <label for="id_{{ field.name }}"
           class="col-sm-2 col-form-label{% if field|field_type == 'booleanfield' %} boolean-label{% endif %}">
        {{ field.label }}{% if field.help_text %}{% help_bubble field.help_text %}{% endif %}
    </label>
    <div class="col-sm-10{% if field|widget_type == "childradioselect" %} overflow-auto"{% endif %}">
        {% include "babybuddy/form_field_no_label.html" %}
    </div>
</div>
