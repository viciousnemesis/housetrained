{% load i18n %}
<div class="food-picker position-relative">
    {% include "django/forms/widgets/select.html" %}
    <button type="button" class="form-select text-start d-none food-picker-button" style="min-height: 3.6rem" aria-haspopup="listbox" aria-expanded="false"></button>
    <div class="food-picker-panel card position-absolute w-100 shadow d-none" style="z-index: 1050">
        <input type="search" class="form-control form-control-sm m-2 w-auto d-none food-picker-search"
               placeholder="{% trans 'Search' %}" aria-label="{% trans 'Search foods' %}" autocomplete="off">
        <div class="list-group list-group-flush food-picker-list" role="listbox" style="max-height: 18rem; overflow-y: auto"></div>
    </div>
</div>
<script>
    // Food picker (PUP-210): rows built once from the select's options; searching only hides rows, so it stays fast.
    (function () {
        var box = document.currentScript.previousElementSibling, select = box.querySelector("select");
        var button = box.querySelector(".food-picker-button"), panel = box.querySelector(".food-picker-panel");
        var search = box.querySelector(".food-picker-search"), list = box.querySelector(".food-picker-list");
        var rows = [];
        var label = function (option) {
            var detail = option.dataset.detail;
            // Name on its own line, what's left below it (PUP-210): a long name is never cut off by the amounts.
            return '<span class="d-block text-wrap"></span>' + (detail ? '<span class="d-block small text-body-secondary"></span>' : "");
        };
        Array.from(select.options).forEach(function (option) {
            if (option.value === "") return;
            var row = document.createElement("button");
            row.type = "button";
            row.className = "list-group-item list-group-item-action text-start";
            row.setAttribute("role", "option");
            row.innerHTML = label(option);
            row.children[0].textContent = option.text;
            if (option.dataset.detail) row.children[1].textContent = option.dataset.detail;
            if (option.value === "new") row.classList.add("text-success");
            row.addEventListener("click", function () { pick(option.value); close(); button.focus(); });
            list.appendChild(row);
            rows.push({row: row, value: option.value, text: option.text.toLowerCase()});
        });
        var show = function () {
            var option = select.options[select.selectedIndex];
            button.innerHTML = option && option.value ? label(option) : "";
            if (option && option.value) {
                button.children[0].textContent = option.text;
                if (option.dataset.detail) button.children[1].textContent = option.dataset.detail;
            } else {
                button.textContent = "{% trans 'Pick a food' %}";
            }
        };
        var pick = function (value) {
            select.value = value;
            select.dispatchEvent(new Event("change", {bubbles: true}));
            show();
        };
        var open = function () {
            panel.classList.remove("d-none");
            button.setAttribute("aria-expanded", "true");
            if (!search.classList.contains("d-none")) { search.value = ""; filter(); search.focus(); }
        };
        var close = function () {
            panel.classList.add("d-none");
            button.setAttribute("aria-expanded", "false");
        };
        var filter = function () {
            var q = search.value.trim().toLowerCase();
            rows.forEach(function (r) { r.row.classList.toggle("d-none", r.value !== "new" && q !== "" && r.text.indexOf(q) < 0); });
        };
        search.classList.toggle("d-none", rows.filter(function (r) { return r.value !== "new"; }).length <= 5);
        search.addEventListener("input", filter);
        search.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {  // the first match
                event.preventDefault();
                var first = rows.find(function (r) { return !r.row.classList.contains("d-none"); });
                if (first) { pick(first.value); close(); button.focus(); }
            } else if (event.key === "Escape") { close(); button.focus(); }
        });
        button.addEventListener("click", function () { panel.classList.contains("d-none") ? open() : close(); });
        document.addEventListener("click", function (event) { if (!box.contains(event.target)) close(); });
        select.classList.add("d-none");
        button.classList.remove("d-none");
        show();
    })();
</script>
