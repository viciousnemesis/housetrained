{% load static %}
{% include "django/forms/widgets/input.html" %}
<label {% if widget.attrs.id %}for="{{ widget.attrs.id }}"{% endif %}
       class="btn btn-outline-light btn-no-hover">
    {% if widget.picture %}
        <img src="{{ widget.picture.url }}" width="40" height="40" class="rounded-circle" style="object-fit: cover" alt="" />
    {% elif widget.pet_type == "dog" %}
        <img src="{% static 'pets/img/pet-placeholder.png' %}" width="40" height="40" class="img-fluid rounded-circle" alt="" />
    {% else %}
        <img src="{% static 'housetrained/logo/icon.png' %}" width="40" height="40" class="img-fluid rounded-circle bg-body-tertiary p-1" alt="" />
    {% endif %}
    {{ widget.label }}
</label>
