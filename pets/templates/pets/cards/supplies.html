{% load i18n %}
{% if supplies %}
    <div class="card card-dashboard">
        <div class="card-header d-flex justify-content-between">
            {% if low_only %}{% trans "Running low" %}{% else %}{% trans "Food and litter" %}{% endif %}
            <a class="small" href="{% url 'pets:pantry' %}">{% trans "Pantry" %}</a>
        </div>
        <ul class="list-group list-group-flush small">
            {% for s in supplies %}{% include "pets/_pantry_row.html" %}{% endfor %}
        </ul>
    </div>
{% endif %}
