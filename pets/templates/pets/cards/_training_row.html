{% load i18n %}
{# One line per command: name, its 2-week average, and small 1-5 buttons (PUP-152). #}
<div class="list-group-item d-flex align-items-center gap-2 py-2">
    <a class="fw-bold text-reset text-decoration-none me-auto lh-sm" style="min-width: 0" href="{% url 'pets:training' pet.slug %}#command-{{ r.command.pk }}">{{ r.command.name }}</a>
    {% if r.avg %}<span class="small text-body-secondary" title="{% trans 'Average, last 2 weeks' %}">{{ r.avg }}</span>{% endif %}
    {% if pets_can_edit %}
        <form class="d-flex gap-1 flex-shrink-0 training-form m-0" method="post" action="{% url 'pets:quick-training' %}">
            {% csrf_token %}
            <input type="hidden" name="command" value="{{ r.command.pk }}">
            <input type="hidden" name="next" value="{{ request.path }}">
            {% for n, label, help in scores %}
                <button class="btn btn-sm btn-outline-light px-0" style="width: 2rem" type="submit" name="score" value="{{ n }}"
                        title="{{ n }} {{ label }}: {{ help }}" aria-label="{{ n }} {{ label }}">{{ n }}</button>
            {% endfor %}
        </form>
    {% endif %}
</div>
