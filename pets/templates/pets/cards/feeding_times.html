{% extends "pets/cards/_base.html" %}
{% load i18n %}
{% block header %}
    {% trans "Meal Times" %}
{% endblock %}
{% block content %}
    <div class="small mb-1">{% trans "Past 2 weeks · logged meals · bigger dot = more eaten" %}</div>
    <svg viewBox="0 0 {{ chart.width }} {{ chart.total_h }}" class="w-100" role="img" aria-label="{% trans 'Meal times by day' %}">
        {% include "pets/cards/_chart_grid.html" %}
        {% for dot in dots %}
            <circle cx="{{ dot.x }}" cy="{{ dot.y }}" r="{{ dot.r }}" fill="#daa520"><title>{{ dot.label }}</title></circle>
        {% endfor %}
    </svg>
{% endblock %}
